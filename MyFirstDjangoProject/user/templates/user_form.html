{% extends "user/base.html" %}
{% block title %}Add User{% endblock %}
{% block content %}
  <h2>Add User</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <p><a href="{% url 'user_list' %}">Cancel</a></p>
{% endblock %}
