{% extends "user/base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
  <h2>User List</h2>
  <ul>
    {% for u in users %}
      <li>
        <a href="{% url 'user_detail' u.pk %}">{{ u.name }}</a>
      </li>
    {% empty %}
      <li>No users yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
