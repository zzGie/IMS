{% extends "user/base.html" %}

{% block title %}User List{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="mb-3">👥 User List</h2>
        {% if users %}
            <ul class="list-group">
                {% for u in users %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <a href="{% url 'user_detail' u.pk %}" class="fw-bold">{{ u.fullname }}</a>
                            <div class="text-muted small">{{ u.email }}</div>
                        </div>
                        <a href="{% url 'user_detail' u.pk %}" class="btn btn-sm btn-primary">View</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="text-muted">No users yet. Add one 👆</p>
        {% endif %}
    </div>
</div>
{% endblock %}
