{% include "partials/header.html" %}

<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body class="sb-nav-fixed">

    {% include "partials/navbar.html" %}
    <div id="layoutSidenav">
        {% include "partials/sidebar.html" %}

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4 py-4">

                    <!-- Branding Left Side -->
                    <div class="brand-section">
                        <h1>USER</h1>
                        <p>Add New</p>
                    </div>

                    <!-- Page Header -->
                    <div class="dashboard-header mb-4">
                        <h2 class="fw-bold text-primary"><i class="fas fa-user-plus me-2"></i>Add New User</h2>
                        <ol class="breadcrumb mt-2 mb-0 bg-transparent p-0">
                            <li class="breadcrumb-item">
                                <a href="{% url 'index' %}" class="text-decoration-none text-muted">Dashboard</a>
                            </li>
                            <li class="breadcrumb-item">
                                <a href="{% url 'userlist' %}" class="text-decoration-none text-muted">Users</a>
                            </li>
                            <li class="breadcrumb-item active text-primary fw-semibold">Add User</li>
                        </ol>
                    </div>

                    <!-- Form Card -->
                    <div class="card form-card shadow p-4 mb-4">
                        <div class="card-header bg-gradient-primary text-white fw-bold">
                            <i class="fas fa-user me-2"></i> Create User
                        </div>
                        <div class="card-body p-4">
                            <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                                {% csrf_token %}
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Full Name</label>
                                        <input type="text" name="fullname" class="form-control form-control-lg" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Username</label>
                                        <input type="text" name="username" class="form-control form-control-lg" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Email</label>
                                        <input type="email" name="email" class="form-control form-control-lg" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Password</label>
                                        <input type="password" name="password" class="form-control form-control-lg" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Contact Number</label>
                                        <input type="text" name="contact_number" class="form-control form-control-lg">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Gender</label>
                                        <select name="gender" class="form-select form-select-lg" required>
                                            <option value="">-- Select --</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Address</label>
                                    <textarea name="address" rows="2" class="form-control form-control-lg"></textarea>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Profile Image</label>
                                    <input type="file" name="user_image" class="form-control form-control-lg">
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <button type="submit" class="btn btn-gradient-primary px-4">
                                        <i class="fas fa-save me-2"></i> Save
                                    </button>
                                    <a href="{% url 'userlist' %}" class="btn btn-outline-secondary px-4">
                                        Cancel
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </main>

            {% include "partials/footer.html" %}
        </div>
    </div>

    {% include "partials/scripts.html" %}

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, skyblue 50%, #007BFF 30%, rgb(215, 232, 243) 20%);
            min-height: 100vh;
        }

        /* Branding Section */
        .brand-section {
            position: fixed;
            top: 50%;
            left: 20%;
            transform: translateY(-50%);
            text-align: left;
            animation: fadeInLeft 1.2s ease-in-out;
            z-index: 5;
        }

        .brand-section h1 {
            font-size: 5rem;
            font-weight: 900;
            color: #b5e7ff;
            text-shadow: 0 0 20px rgba(0, 195, 255, 0.8),
                         0 0 35px rgba(0, 195, 255, 0.6);
        }

        .brand-section p {
            font-size: 2rem;
            font-weight: 600;
            color: #c2ecff;
            text-shadow: 0 0 15px rgba(0, 195, 255, 0.7);
        }

        /* Form Card */
        .form-card {
            backdrop-filter: blur(5px);
             background: rgba(188, 210, 235, 0.9);;
            border-radius: 20px;
            margin-left: 35%;
        }

        /* Input Focus */
        .form-control-lg, .form-select-lg {
            border-radius: 0.5rem;
            font-size: 1rem;
            padding: 0.75rem;
        }

        .form-control-lg:focus, .form-select-lg:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        /* Button Gradient */
        .btn-gradient-primary {
            background: linear-gradient(45deg, #007bff, #00c6ff);
            color: white;
            border: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-gradient-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 123, 255, 0.3);
        }

        /* Animations */
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-100px) translateY(-50%); }
            to { opacity: 1; transform: translateX(0) translateY(-50%); }
        }
    </style>

</body>
</html>
