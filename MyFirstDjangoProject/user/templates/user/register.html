{% load static %}
{% include "partials/header.html" %}

<head>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, skyblue 50%, #007BFF 30%, white 20%);
            height: 100vh;
            overflow: hidden;
        }

        /* Left Branding Section */
        .brand-section {
            position: absolute;
            top: 50%;
            left: 6%;
            transform: translateY(-50%);
            color: white;
            animation: fadeInLeft 1.2s ease-in-out;
        }

        .brand-section h1 {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: 3px 3px 20px rgba(0, 0, 0, 0.3);
        }

        .brand-section p {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Register Card */
        .register-card {
            width: 500px;
            background-color: #ffffffee;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            animation: fadeInUp 1s ease-in-out;
        }

        .register-card h2 {
            font-weight: 700;
            color: #007BFF;
        }

        .btn-custom {
            background: linear-gradient(to right, #00BFFF, #007BFF);
            border: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease-in-out;
        }

        .btn-custom:hover {
            background: linear-gradient(to right, #0099ff, #0056b3);
            transform: scale(1.05);
        }

        /* Floating Messages */
        .floating-message {
            z-index: 9999;
        }

        /* Animations */
        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px) translateY(-50%);
            }
            to {
                opacity: 1;
                transform: translateX(0) translateY(-50%);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="sb-nav-fixed">

    <!-- Left Branding Section -->
    <div class="brand-section">
        <h1>TAYRNAV</h1>
        <p>Tire Inventory Management System</p>
    </div>

    <!-- Register Form (Right Side) -->
    <div class="container d-flex justify-content-end align-items-center vh-100 pe-5">
        <div class="card register-card">
            <h2 class="text-center mb-4">📝 Register</h2>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row">
                    <!-- Full Name -->
                    <div class="col-md-6 mb-3">
                        <label for="fullname" class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="fullname" id="fullname" class="form-control rounded-3" required>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" id="email" class="form-control rounded-3" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Username -->
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" id="username" class="form-control rounded-3" required>
                    </div>

                    <!-- Role -->
                    <div class="col-md-6 mb-3">
                        <label for="role" class="form-label fw-semibold">Role</label>
                        <select name="role" id="role" class="form-select rounded-3" required>
                            <option value="">Select Role</option>
                            <option value="regular">Regular User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <!-- Password -->
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" id="password" class="form-control rounded-3" required>
                    </div>

                    <!-- Confirm Password -->
                    <div class="col-md-6 mb-3">
                        <label for="confirm_password" class="form-label fw-semibold">Confirm</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control rounded-3" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Gender -->
                    <div class="col-md-6 mb-3">
                        <label for="gender" class="form-label fw-semibold">Gender</label>
                        <select name="gender" id="gender" class="form-select rounded-3" required>
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <!-- Contact -->
                    <div class="col-md-6 mb-3">
                        <label for="contact_number" class="form-label fw-semibold">Contact</label>
                        <input type="text" name="contact_number" id="contact_number" class="form-control rounded-3" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-custom w-100 rounded-3 mt-3">
                    Register
                </button>
            </form>

            <p class="mt-3 text-center">
                Already have an account?
                <a href="{% url 'login' %}" class="text-decoration-none text-primary fw-semibold">Login here</a>
            </p>
        </div>
    </div>

    <!-- Floating Message (Bottom Right) -->
    <div class="position-fixed bottom-0 end-0 p-3 floating-message">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} shadow fade show rounded-3" role="alert" id="alertMessage">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <script>
        // Auto remove alert after 5 seconds
        setTimeout(() => {
            const alert = document.getElementById('alertMessage');
            if (alert) alert.remove();
        }, 5000);
    </script>

    {% include "partials/scripts.html" %}
</body>
</html>
