{% include "partials/header.html" %}

<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body class="sb-nav-fixed">
    {% include "partials/navbar.html" %}

    <div id="layoutSidenav">
        {% include "partials/sidebar.html" %}

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4 py-4">

                    <!-- Page Header -->
                    <div class="dashboard-header mb-4 d-flex align-items-center justify-content-between">
                        <h2 class="fw-bold text-primary">
                            <i class="fas fa-edit me-2"></i> Edit Tire Item
                        </h2>
                        <a href="{% url 'inventory_list' %}" class="btn btn-outline-secondary btn-sm fs-6">
                            <i class="fas fa-arrow-left me-1"></i> Back
                        </a>
                    </div>

                    <!-- Edit Form Card -->
                    <div class="card form-card shadow border-0">
                        <div class="card-header bg-gradient-primary text-white fw-bold fs-5">
                            <i class="fas fa-pencil-alt me-2"></i> Update Tire Information
                        </div>
                        <div class="card-body p-4">
                            <form method="post">
                                {% csrf_token %}

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold fs-5">Tire Name</label>
                                        <input type="text" name="ItemName" value="{{ item.ItemName }}" class="form-control form-control-lg fs-5" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold fs-5">Tire Type</label>
                                        <select name="Category" class="form-select form-select-lg fs-5" required>
                                            <option value="" disabled>Select Tire Type</option>
                                            <option value="Motorcycle Tire" {% if item.Category == "Motorcycle Tire" %}selected{% endif %}>Motorcycle Tire</option>
                                            <option value="Car Tire" {% if item.Category == "Car Tire" %}selected{% endif %}>Car Tire</option>
                                            <option value="SUV Tire" {% if item.Category == "SUV Tire" %}selected{% endif %}>SUV Tire</option>
                                            <option value="Truck Tire" {% if item.Category == "Truck Tire" %}selected{% endif %}>Truck Tire</option>
                                            <option value="All-Terrain Tire" {% if item.Category == "All-Terrain Tire" %}selected{% endif %}>All-Terrain Tire</option>
                                            <option value="Off-Road Tire" {% if item.Category == "Off-Road Tire" %}selected{% endif %}>Off-Road Tire</option>
                                            <option value="Performance Tire" {% if item.Category == "Performance Tire" %}selected{% endif %}>Performance Tire</option>
                                            <option value="Winter Tire" {% if item.Category == "Winter Tire" %}selected{% endif %}>Winter Tire</option>
                                            <option value="Spare Tire" {% if item.Category == "Spare Tire" %}selected{% endif %}>Spare Tire</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold fs-5">Quantity</label>
                                        <input type="number" name="Quantity" value="{{ item.Quantity }}" class="form-control form-control-lg fs-5" min="0">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold fs-5">Price (₱)</label>
                                        <input type="number" step="0.01" name="Price" value="{{ item.Price }}" class="form-control form-control-lg fs-5" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold fs-5">Description</label>
                                    <textarea name="Description" class="form-control form-control-lg fs-5" rows="3">{{ item.Description }}</textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <button type="submit" class="btn btn-gradient-primary px-5 fs-5">
                                        <i class="fas fa-save me-2"></i> Update Tire
                                    </button>
                                    <a href="{% url 'inventory_list' %}" class="btn btn-outline-secondary px-5 fs-5">
                                        Cancel
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </main>
            {% include "partials/footer.html" %}
        </div>
    </div>

    {% include "partials/scripts.html" %}

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, skyblue 50%, #007BFF 30%, rgb(215, 232, 243) 20%);
        }

        .form-card {
            backdrop-filter: blur(5px);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            transition: all 0.3s ease;
        }
        .form-card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .bg-gradient-primary {
            background: linear-gradient(45deg, #007bff, #00c6ff);
        }

        .form-control-lg, .form-select-lg {
            border-radius: 0.5rem;
            font-size: 1.15rem;
            padding: 0.85rem;
        }
        .form-control-lg:focus, .form-select-lg:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .btn-gradient-primary {
            background: linear-gradient(45deg, #007bff, #00c6ff);
            color: white;
            border: none;
            transition: 0.3s ease;
            font-size: 1.15rem;
            padding: 0.75rem 1.5rem;
        }
        .btn-gradient-primary:hover {
            background: linear-gradient(45deg, #0056b3, #00a1e0);
        }

        .btn-outline-secondary {
            font-size: 1.1rem;
            font-weight: 500;
        }

        label.form-label { font-size: 1.15rem; }
    </style>
</body>
</html>
