{% include "partials/header.html" %}
<body class="sb-nav-fixed bg-light">

{% include "partials/navbar.html" %}

<div id="layoutSidenav">
    {% include "partials/sidebar.html" %}

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4 py-4">
                <h1 class="fw-bold text-warning mb-4">✏️ Edit Inventory Item</h1>

                <div class="card shadow border-0">
                    <div class="card-body bg-white">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Item Name</label>
                                <input type="text" name="ItemName" value="{{ item.ItemName }}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" name="Category" value="{{ item.Category }}" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Quantity</label>
                                <input type="number" name="Quantity" value="{{ item.Quantity }}" class="form-control" min="0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Price (₱)</label>
                                <input type="number" step="0.01" name="Price" value="{{ item.Price }}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea name="Description" class="form-control" rows="3">{{ item.Description }}</textarea>
                            </div>
                            <button type="submit" class="btn btn-warning text-white">Update Item</button>
                            <a href="{% url 'inventory_list' %}" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        {% include "partials/footer.html" %}
    </div>
</div>

{% include "partials/scripts.html" %}
</body>
</html>
