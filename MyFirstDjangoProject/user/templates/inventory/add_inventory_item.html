{% include "partials/header.html" %}
<body class="sb-nav-fixed bg-light">

{% include "partials/navbar.html" %}

<div id="layoutSidenav">
    {% include "partials/sidebar.html" %}

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4 py-4">
                <!-- Page Title -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="fw-bold text-primary m-0">
                        <i class="bi bi-box-seam me-2"></i> Add Tire Inventory Item
                    </h1>
                    <a href="{% url 'inventory_list' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left-circle me-1"></i> Back to Inventory
                    </a>
                </div>

                <!-- Form Card -->
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-primary text-white fw-semibold">
                        <i class="bi bi-plus-circle me-1"></i> New Tire Item Details
                    </div>
                    <div class="card-body bg-white">
                        <form method="post" novalidate>
                            {% csrf_token %}

                            <div class="row g-3">
                                <!-- Item Name -->
                                <div class="col-md-6">
                                    <label class="form-label">Tire Name <span class="text-danger">*</span></label>
                                    <input type="text" name="ItemName" class="form-control" placeholder="e.g. Dunlop 90/80-17" required>
                                </div>

                                <!-- Category Dropdown -->
                                <div class="col-md-6">
                                    <label class="form-label">Category <span class="text-danger">*</span></label>
                                    <select name="Category" class="form-select" required>
                                        <option value="" selected disabled>-- Select Category --</option>
                                        <option value="Motorcycle Tire">Motorcycle Tire</option>
                                        <option value="Car Tire">Car Tire</option>
                                        <option value="Truck Tire">Truck Tire</option>
                                        <option value="Inner Tube">Inner Tube</option>
                                        <option value="Rim">Rim</option>
                                        <option value="Tire Accessory">Tire Accessory</option>
                                    </select>
                                </div>

                                <!-- Quantity -->
                                <div class="col-md-4">
                                    <label class="form-label">Quantity</label>
                                    <input type="number" name="Quantity" class="form-control" value="0" min="0">
                                </div>

                                <!-- Price -->
                                <div class="col-md-4">
                                    <label class="form-label">Price (₱) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" name="Price" class="form-control" placeholder="0.00" required>
                                </div>

                                <!-- Date (Read only) -->
                                <div class="col-md-4">
                                    <label class="form-label">Date Added</label>
                                    <input type="text" class="form-control" value="{{ now|date:'M d, Y' }}" readonly>
                                </div>

                                <!-- Description -->
                                <div class="col-12">
                                    <label class="form-label">Description</label>
                                    <textarea name="Description" class="form-control" rows="3" placeholder="e.g. Tubeless, All Season, For 17-inch rim"></textarea>
                                </div>
                            </div>

                            <!-- Buttons -->
                            <div class="mt-4 d-flex justify-content-end gap-2">
                                <button type="submit" class="btn btn-gradient-primary px-4">
                                    <i class="bi bi-save me-1"></i> Save Item
                                </button>
                                <a href="{% url 'inventory_list' %}" class="btn btn-light border px-4">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        {% include "partials/footer.html" %}
    </div>
</div>

{% include "partials/scripts.html" %}

<!-- ✅ Gradient Button Style -->
<style>
.btn-gradient-primary {
    background: linear-gradient(90deg, #0062E6 0%, #33AEFF 100%);
    color: #fff;
    border: none;
    transition: background 0.3s ease;
}
.btn-gradient-primary:hover {
    background: linear-gradient(90deg, #0052c6 0%, #2296e6 100%);
    color: #fff;
}
</style>
</body>
</html>
